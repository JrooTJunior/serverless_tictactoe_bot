<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Tic Tac Toe</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    /* Colors come from the Telegram theme (set by telegram-web-app.js); fallbacks for a plain browser. */
    body {
      margin: 0; padding: 24px 16px; text-align: center;
      font: 16px/1.4 system-ui, sans-serif;
      background: var(--tg-theme-bg-color, #fff);
      color: var(--tg-theme-text-color, #000);
    }
    h1 { font-size: 20px; margin: 0 0 20px; }
    #board {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
      max-width: 320px; margin: 0 auto;
    }
    #board button {
      aspect-ratio: 1; border: 0; border-radius: 12px; font-size: 44px;
      background: var(--tg-theme-secondary-bg-color, #f0f0f0); color: inherit;
    }
    #board button:enabled { cursor: pointer; }
    #board button.win { background: var(--tg-theme-button-color, #2481cc); }
    #status { margin-top: 20px; min-height: 1.4em; color: var(--tg-theme-hint-color, #888); }
  </style>
</head>
<body>
  <h1>❌ you vs ⭕ bot</h1>
  <div id="board"></div>
  <p id="status">Loading…</p>
  <script>
    const tg = Telegram.WebApp;
    const board = document.getElementById('board');
    const status = document.getElementById('status');
    const MARKS = { X: '❌', O: '⭕', '.': '' };
    const RESULTS = { X: 'You won 🎉', O: 'Bot wins 🤖', draw: 'Draw 🤝' };

    const cells = Array.from({ length: 9 }, (_, i) => {
      const b = board.appendChild(document.createElement('button'));
      b.setAttribute('aria-label', `Cell ${i + 1}`);
      b.onclick = () => move(i);
      return b;
    });

    let game = null, busy = true;

    const call = (name, input) => new Promise((resolve, reject) =>
      tg.Serverless.call(name, input, (err, result) => (err ? reject(err) : resolve(result))));

    function draw() {
      const result = game?.outcome;
      cells.forEach((b, i) => {
        const mark = game ? game.board[i] : '.';
        b.textContent = MARKS[mark];
        b.disabled = busy || !game || mark !== '.' || !!result;
        b.classList.toggle('win', !!result?.line?.includes(i));
      });
      status.textContent = result ? RESULTS[result.winner] : busy ? 'Bot is thinking…' : game ? 'Your move' : 'Could not load the game';
    }

    // Runs one call with the board locked; the server's game replaces ours. false on error.
    async function load(name, input) {
      busy = true;
      draw();
      let ok = true;
      try {
        game = await call(name, input);
        if (name === 'move' && game.outcome) tg.HapticFeedback.notificationOccurred(game.outcome.winner === 'O' ? 'error' : 'success');
      } catch (err) {
        tg.showAlert(err.message || 'Something went wrong');
        ok = false;
      }
      busy = false;
      draw();
      return ok;
    }

    async function move(cell) {
      tg.HapticFeedback.impactOccurred('light');
      game.board = game.board.slice(0, cell) + 'X' + game.board.slice(cell + 1); // shown until the server answers
      // On error our board is stale (e.g. the cell was taken in chat): fetch the real one.
      if (!(await load('move', { id: game.id, cell }))) await load('getGame', { id: game.id });
    }

    if (!tg.initData) {
      status.textContent = 'Open this game from the bot in Telegram.';
    } else {
      tg.ready();
      tg.expand();
      tg.MainButton.setText('🔄 New game').onClick(() => load('newGame', {})).show();
      const id = Number(new URLSearchParams(location.search).get('game')) || undefined;
      load('getGame', { id });
    }
  </script>
</body>
</html>
